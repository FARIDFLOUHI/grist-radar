<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de couverture par BEF</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { --ink:#1f2933; --muted:#6b7785; --grid:#d5dbe1; --bad:#c0392b; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6eaee; --muted:#9aa5b1; --grid:#3b4653; --bad:#ff7b6b; --bg:#1b2229; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  #app { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:center; padding:12px 16px; box-sizing:border-box; min-height:100%; }
  #chart { flex:1 1 380px; min-width:300px; max-width:640px; }
  #chart svg { width:100%; height:auto; display:block; }
  #side { flex:0 1 260px; min-width:200px; }
  .score { font-size:28px; font-weight:700; letter-spacing:-.5px; }
  .score small { font-size:14px; font-weight:400; color:var(--muted); }
  .legend { list-style:none; margin:10px 0; padding:0; }
  .legend li { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .sw { width:22px; height:0; border-top:3px solid; flex:none; }
  .miss { color:var(--bad); font-weight:600; }
  .ok { color:#2e7d4f; font-weight:600; }
  #msg { text-align:center; color:var(--muted); padding:40px 16px; width:100%; }
  svg text { fill:var(--ink); font-size:12.5px; }
  svg text.gap { fill:var(--bad); font-weight:700; }
</style>
</head>
<body>
<div id="app"><div id="msg">Sélectionnez un BEF pour afficher sa couverture.</div></div>
<script>
// Toute colonne dont l'identifiant commence par "R_" devient un axe du radar (valeur 0/1).
const PREFIX = "R_";
const LABELS = {                       // libellés courts (facultatif : sinon l'identifiant est mis en forme)
  R_Pole_Accueil: "Pôle d'accueil", R_MOREA_MOREX: "MOREA/MOREX", R_Accueil_multimodal: "Accueil multimodal",
  R_Entrees_Sorties: "Entrées/sorties perm.", R_Sessions: "Sessions",
  R_Professeurs: "Professeurs", R_AED: "AED", R_PSY_EN: "PSY-EN",
  R_Entreprises: "Entreprises", R_Associations: "Associations", R_Autres: "Autres intervenants"
};
const COLORS = ["#1b6ca8", "#d9822b", "#3f9a6b", "#8a5aa8", "#b5485d", "#7a8b99"];
const NS = "http://www.w3.org/2000/svg";

const num = v => (v === true || v === "Oui") ? 1 : (Number(v) > 0 ? 1 : 0);
const label = k => LABELS[k] || k.slice(PREFIX.length).replace(/_/g, " ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render(records) {
  const app = document.getElementById("app");
  if (!records || !records.length) {
    app.innerHTML = '<div id="msg">Sélectionnez un BEF pour afficher sa couverture.</div>'; return;
  }
  const axes = Object.keys(records[0]).filter(k => k.startsWith(PREFIX));
  if (axes.length < 3) {
    app.innerHTML = '<div id="msg">Il faut au moins 3 colonnes dont l\'identifiant commence par « ' + PREFIX + ' » dans la table.</div>'; return;
  }
  const n = axes.length, cx = 300, cy = 235, R = 150;
  const ang = i => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const poly = vals => vals.map((v, i) => pt(i, R * v).map(x => x.toFixed(1)).join(",")).join(" ");

  const projects = records.map((r, idx) => ({
    name: r.Legende || ("Projet " + (r.id ?? idx + 1)),
    vals: axes.map(a => num(r[a])), color: COLORS[idx % COLORS.length]
  }));
  const union = axes.map((_, i) => Math.max(...projects.map(p => p.vals[i])));
  const covered = union.reduce((a, b) => a + b, 0);
  const gaps = axes.filter((_, i) => !union[i]).map(label);

  let s = '<svg viewBox="0 0 600 470" role="img" aria-label="Radar de couverture : ' + covered + ' critères sur ' + n + '">';
  // grille
  [0.5, 1].forEach(f => { s += '<polygon points="' + poly(Array(n).fill(f)) + '" fill="none" stroke="var(--grid)" stroke-width="1"' + (f < 1 ? ' stroke-dasharray="3 4"' : '') + '/>'; });
  axes.forEach((_, i) => { const [x, y] = pt(i, R); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--grid)"/>'; });
  // projets
  projects.forEach(p => { s += '<polygon points="' + poly(p.vals) + '" fill="' + p.color + '" fill-opacity=".14" stroke="' + p.color + '" stroke-width="1.6" stroke-linejoin="round"/>'; });
  // couverture du BEF (trait épais)
  s += '<polygon points="' + poly(union) + '" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linejoin="round"/>';
  union.forEach((v, i) => { const [x, y] = pt(i, R * v); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (v ? 4.5 : 3) + '" fill="' + (v ? 'var(--ink)' : 'var(--bg)') + '" stroke="' + (v ? 'var(--ink)' : 'var(--bad)') + '" stroke-width="2"/>'; });
  // libellés
  axes.forEach((a, i) => {
    const [x, y] = pt(i, R + 16), c = Math.cos(ang(i));
    const anchor = Math.abs(c) < 0.2 ? "middle" : (c > 0 ? "start" : "end");
    const dy = Math.sin(ang(i)) > 0.5 ? 10 : (Math.sin(ang(i)) < -0.5 ? -2 : 4);
    s += '<text x="' + x.toFixed(1) + '" y="' + (y + dy).toFixed(1) + '" text-anchor="' + anchor + '"' + (union[i] ? '' : ' class="gap"') + '>' + esc(label(a)) + (union[i] ? '' : ' ✗') + '</text>';
  });
  s += '</svg>';

  let side = '<div class="score">' + covered + '<small> / ' + n + ' critères couverts</small></div><ul class="legend">';
  projects.forEach(p => { side += '<li><span class="sw" style="border-color:' + p.color + '"></span>' + esc(p.name) + '</li>'; });
  side += '<li><span class="sw" style="border-color:var(--ink);border-top-width:4px"></span><b>Couverture du BEF</b></li></ul>';
  side += gaps.length ? '<div class="miss">Non couverts : ' + gaps.map(esc).join(", ") + '</div>' : '<div class="ok">Tous les critères sont couverts.</div>';

  app.innerHTML = '<div id="chart">' + s + '</div><div id="side">' + side + '</div>';
}

// Deux modes de fonctionnement :
//  A) widget sur la table Candidatures, lié par « Sélectionner par » : Grist envoie déjà les projets filtrés ;
//  B) widget sur la table de synthèse [par Departement, BEF], lié au tableau de BEF : la page lit la ligne
//     sélectionnée puis récupère elle-même les projets du BEF (accès complet requis).
const hasAxes = r => r && Object.keys(r).some(k => k.startsWith(PREFIX));
grist.ready({ requiredAccess: "full" });

grist.onRecords(rows => { if (rows && rows.length && hasAxes(rows[0])) render(rows); });

let seq = 0;
grist.onRecord(async rec => {
  if (!rec || hasAxes(rec)) return;              // mode A : géré par onRecords
  const me = ++seq;
  if (rec.BEF == null) { render([]); return; }
  try {
    const t = await grist.docApi.fetchTable("Candidatures");
    const keys = Object.keys(t), out = [];
    for (let i = 0; i < t.id.length; i++) {
      if (t.BEF[i] !== rec.BEF) continue;
      const row = {}; keys.forEach(k => row[k] = t[k][i]); out.push(row);
    }
    if (me === seq) render(out);
  } catch (e) {
    if (me === seq) document.getElementById("app").innerHTML = '<div id="msg">Impossible de lire la table Candidatures : ' + esc(e.message || e) + '</div>';
  }
});
</script>
</body>
</html>
